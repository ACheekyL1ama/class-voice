<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班级意见箱</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 顶部极简标题栏 -->
  <header class="header">
    <div>
      <h1 class="header-title" id="navSiteTitle">班级意见箱</h1>
      <p class="header-sub" id="navClassName">匿名提交 · 凭回执码查询进度</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-ghost" id="themeToggleBtn" title="切换深浅色">🌙</button>
    </div>
  </header>

  <main class="container">
    <!-- 简洁三栏切换 -->
    <nav class="nav-tabs" aria-label="页面切换">
      <button type="button" class="tab-btn active" data-tab="submit">提交意见</button>
      <button type="button" class="tab-btn" data-tab="wall">意见墙 (<span id="publicCountBadge">0</span>)</button>
      <button type="button" class="tab-btn" data-tab="lookup">回执查询</button>
    </nav>

    <!-- ==================== TAB 1: 提交意见 ==================== -->
    <section class="tab-panel active" id="panel-submit">
      <div class="card">
        <form id="feedbackForm">
          <!-- 分类 -->
          <div class="field">
            <label class="label">分类</label>
            <div class="cat-chips" id="categoryGrid"></div>
          </div>

          <!-- 标题 -->
          <div class="field">
            <label class="label" for="fbTitle">主题 <span style="color: var(--red);">*</span></label>
            <input
              type="text"
              id="fbTitle"
              class="input"
              placeholder="简短概括你的问题或建议"
              maxlength="60"
              required
            />
          </div>

          <!-- 详细内容 -->
          <div class="field">
            <label class="label" for="fbContent">具体内容 <span style="color: var(--red);">*</span></label>
            <textarea
              id="fbContent"
              class="textarea"
              placeholder="请详细描述具体情况或改进建议..."
              required
            ></textarea>
          </div>

          <!-- 选填联系方式 -->
          <div class="field">
            <label class="label" for="fbContact">
              联系方式 <span class="label-sub">（选填，不填则完全匿名；仅班委可见）</span>
            </label>
            <input
              type="text"
              id="fbContact"
              class="input"
              placeholder="如需班委私下联系你，可留微信 / 学号 / 姓名"
              maxlength="80"
            />
          </div>

          <!-- 是否公开选项 -->
          <div class="form-footer-options">
            <label class="checkbox-label">
              <input type="checkbox" id="fbIsPublic" checked />
              <span>允许在班级意见墙公开展示（隐藏联系方式）</span>
            </label>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">提交意见</button>
        </form>
      </div>
    </section>

    <!-- ==================== TAB 2: 意见墙 ==================== -->
    <section class="tab-panel" id="panel-wall">
      <div class="list-toolbar">
        <div class="cat-chips" id="wallCategoryFilters"></div>
        <select id="wallSortSelect" class="select" style="width: auto; padding: 0.35rem 0.65rem; font-size: 0.8rem;">
          <option value="newest">最新提交</option>
          <option value="upvotes">最多附议</option>
        </select>
      </div>

      <div id="publicWallGrid"></div>
    </section>

    <!-- ==================== TAB 3: 回执码查询 ==================== -->
    <section class="tab-panel" id="panel-lookup">
      <div class="card">
        <label class="label" for="lookupCodeInput">输入回执码查询处理进度</label>
        <div style="display: flex; gap: 0.5rem;">
          <input
            type="text"
            id="lookupCodeInput"
            class="input"
            placeholder="例如：MX-8A3F"
            maxlength="12"
            style="text-transform: uppercase; font-family: monospace;"
          />
          <button type="button" class="btn-submit" id="lookupSearchBtn" style="width: auto; padding: 0 1.4rem;">
            查询
          </button>
        </div>

        <div id="lookupResultContainer" style="margin-top: 1rem;"></div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <span class="label" style="margin-bottom: 0;">本机提交记录</span>
          <button type="button" class="btn-ghost" id="clearMyReceiptsBtn" style="font-size: 0.75rem; padding: 0.2rem 0.55rem;">
            清空记录
          </button>
        </div>
        <div id="myLocalReceiptsList"></div>
      </div>
    </section>

    <!-- ==================== 班委后台面板（默认隐藏，点击底部入口进入） ==================== -->
    <section class="tab-panel" id="panel-admin">
      <!-- 口令解锁 -->
      <div class="card" id="adminLockCard" style="max-width: 400px; margin: 1rem auto; text-align: center;">
        <div class="label" style="font-size: 1rem; margin-bottom: 0.75rem;">班委管理后台</div>
        <div style="display: flex; gap: 0.5rem;">
          <input
            type="password"
            id="adminPassInput"
            class="input"
            placeholder="输入管理口令"
            style="text-align: center;"
          />
          <button type="button" class="btn-submit" id="adminUnlockBtn" style="width: auto; padding: 0 1.2rem;">
            进入
          </button>
        </div>
      </div>

      <!-- 解锁后管理页 -->
      <div id="adminDashboard" style="display: none;">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
          <div style="font-weight: 600; font-size: 0.95rem;">
            共收到 <span id="adminTotalCount">0</span> 条意见
          </div>
          <div style="display: flex; gap: 0.45rem; flex-wrap: wrap;">
            <select id="adminFilterSelect" class="select" style="width: auto; padding: 0.35rem 0.6rem; font-size: 0.8rem;">
              <option value="all">全部意见</option>
              <option value="private">仅班委可见</option>
              <option value="contact">含联系方式</option>
              <option value="pending">待处理</option>
            </select>
            <button type="button" class="btn-outline" id="exportCsvBtn">导出表格 (.csv)</button>
            <button type="button" class="btn-outline" id="clearDemoBtn">清空示例数据</button>
            <button type="button" class="btn-outline" id="openConfigModalBtn">设置</button>
          </div>
        </div>

        <div id="adminFeedbackList"></div>
      </div>
    </section>

    <!-- 底部低调班委入口 -->
    <footer style="text-align: center; margin-top: 2.5rem; font-size: 0.78rem; color: var(--text-light);">
      <a href="#admin" id="footerAdminLink" style="color: var(--text-light); text-decoration: none;">班委管理</a>
    </footer>
  </main>

  <!-- 提交成功弹窗 -->
  <div class="modal-mask" id="receiptModal">
    <div class="modal-box" style="text-align: center;">
      <div style="font-size: 1.05rem; font-weight: 700; margin-bottom: 0.35rem;">提交成功</div>
      <p style="font-size: 0.82rem; color: var(--text-sub); margin-bottom: 1rem;">
        请保存你的回执码，班会上将按此编号回应：
      </p>
      <div
        id="modalReceiptCode"
        style="font-family: monospace; font-size: 1.75rem; font-weight: 700; padding: 0.75rem; background: var(--bg-muted); border-radius: 8px; letter-spacing: 0.08em; margin-bottom: 1.2rem;"
      >
        MX-8A3F
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" class="btn-submit" id="copyReceiptBtn">复制回执码</button>
        <button type="button" class="btn-outline" id="closeReceiptModalBtn" style="flex: 1;">关闭</button>
      </div>
    </div>
  </div>

  <!-- 简单设置弹窗 -->
  <div class="modal-mask" id="configModal">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <span style="font-weight: 700;">基本设置</span>
        <button type="button" class="btn-ghost" id="closeConfigModalBtn" style="padding: 0.2rem 0.5rem;">✕</button>
      </div>
      <div class="field">
        <label class="label">页面标题</label>
        <input type="text" id="cfgSiteTitle" class="input" placeholder="如：班级意见箱" />
      </div>
      <div class="field">
        <label class="label">副标题 / 班级名称</label>
        <input type="text" id="cfgClassName" class="input" placeholder="如：计算机1班 · 匿名提交" />
      </div>
      <div class="field">
        <label class="label">班委管理口令</label>
        <input type="text" id="cfgAdminPass" class="input" placeholder="默认 8888" />
      </div>
      <button type="button" class="btn-submit" id="saveConfigBtn">保存设置</button>
    </div>
  </div>

  <div class="toast-wrap" id="toastContainer"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
